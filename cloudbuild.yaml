# Build dell'immagine + push su Artifact Registry + deploy su Cloud Run.
#
#   gcloud builds submit --config cloudbuild.yaml --region europe-west8
#
# Prerequisiti (una tantum): repository Artifact Registry "${_REPO}" nella regione
# e, per il service account di Cloud Build, i ruoli roles/run.admin e
# roles/iam.serviceAccountUser. Il servizio nasce PRIVATO (--no-allow-unauthenticated).
substitutions:
  _REGION: europe-west8
  _REPO: rizzo
  _SERVICE: rizzo-pii
  _MODEL_REVISION: v1.5.0

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=MODEL_REVISION=${_MODEL_REVISION}
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --no-allow-unauthenticated
      - --memory=4Gi
      - --cpu=2
      - --cpu-boost
      - --concurrency=4
      - --timeout=300
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=OMP_NUM_THREADS=2,GUNICORN_THREADS=4

options:
  machineType: E2_HIGHCPU_8
timeout: 2400s
