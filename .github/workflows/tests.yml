name: tests

# Su main e su ogni pull request. Il push e' filtrato su main apposta: senza il
# filtro un branch aperto nello stesso repo farebbe girare due volte lo stesso
# job, una per il push e una per la PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # 3.11 e' il minimo dichiarato in requirements.txt, 3.14 la piu' recente.
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Solo flask (per test_api.py): torch/transformers non servono, i test usano
      # un modello finto. L'inferenza del modello vero non e' sotto test.
      - name: install flask
        run: pip install "flask>=3.0,<4"

      - name: unittest discover
        run: python -m unittest discover -v tests
